name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK
        working-directory: ungraey_flutter
        run: flutter build apk --release

      - name: Prepare APK asset
        run: |
          cp ungraey_flutter/build/app/outputs/flutter-apk/app-release.apk ungraey_flutter/build/app/outputs/flutter-apk/ungraey-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ungraey-release-apk
          path: ungraey_flutter/build/app/outputs/flutter-apk/ungraey-release.apk

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'latest' }}
          name: ${{ github.event.inputs.tag_name || (startsWith(github.ref, 'refs/tags/') && github.ref_name) || 'Ungraey Release (Latest)' }}
          files: |
            ungraey_flutter/build/app/outputs/flutter-apk/ungraey-release.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
