name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v4 or v4.0.0)'
        required: false
        default: 'v4'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.4'
          channel: 'stable'
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build Release APK (Split per ABI)
        working-directory: ungraey_flutter
        run: flutter build apk --release --split-per-abi

      - name: Prepare APK assets
        run: |
          cd ungraey_flutter/build/app/outputs/flutter-apk
          for f in app-*-release.apk; do
            if [ -f "$f" ]; then
              cp "$f" "ungraey-${f#app-}"
            fi
          done
          ls -la

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ungraey-split-apks
          path: ungraey_flutter/build/app/outputs/flutter-apk/ungraey-*.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v4"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create & Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Ungraey Release ${{ steps.release_tag.outputs.tag }}
          files: |
            ungraey_flutter/build/app/outputs/flutter-apk/ungraey-*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
