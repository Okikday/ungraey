name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Tag (e.g. v4 or v4.0.0)'
        required: false
        default: 'v4'

permissions:
  contents: write

jobs:
  build:
    name: Build & Release
    runs-on: macos-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.4'
          channel: 'stable'

      - name: Get dependencies (Client)
        run: dart pub get
        working-directory: ungraey_client

      - name: Get dependencies (Flutter)
        run: flutter pub get
        working-directory: ungraey_flutter

      - name: Build macOS App
        run: flutter build macos --release
        working-directory: ungraey_flutter

      - name: Compress macOS App
        run: |
          cd ungraey_flutter/build/macos/Build/Products/Release
          zip -r "$GITHUB_WORKSPACE/ungraey-macos.zip" ungraey_flutter.app

      - name: Build Android APKs (Split by ABI)
        run: flutter build apk --split-per-abi --release
        working-directory: ungraey_flutter

      - name: Gather Android APKs
        run: |
          mkdir -p "$GITHUB_WORKSPACE/apks"
          cp ungraey_flutter/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk "$GITHUB_WORKSPACE/apks/ungraey-armeabi-v7a.apk"
          cp ungraey_flutter/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk "$GITHUB_WORKSPACE/apks/ungraey-arm64-v8a.apk"
          cp ungraey_flutter/build/app/outputs/flutter-apk/app-x86_64-release.apk "$GITHUB_WORKSPACE/apks/ungraey-x86_64.apk"

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-binaries
          path: |
            ungraey-macos.zip
            apks/*.apk

      - name: Determine Release Tag
        id: release_tag
        run: |
          if [ -n "${{ inputs.tag_name }}" ]; then
            TAG="${{ inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${{ github.ref_name }}"
          else
            TAG="v4"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT

      - name: Create Release and Upload Assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.tag }}
          name: Release ${{ steps.release_tag.outputs.tag }}
          files: |
            ungraey-macos.zip
            apks/ungraey-armeabi-v7a.apk
            apks/ungraey-arm64-v8a.apk
            apks/ungraey-x86_64.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
