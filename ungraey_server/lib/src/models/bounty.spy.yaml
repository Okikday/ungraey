class: Bounty
table: bounty
fields:
  creatorId: int
  creatorName: String
  title: String
  description: String
  category: MaterialCategory
  quantityNeeded: int
  quantityFulfilled: int, default=0
  rewardAmountCents: int
  rewardType: RewardType
  tradeItemDescription: String?
  latitude: double
  longitude: double
  addressSnippet: String
  radiusMiles: double, default=5.0
  status: String, default='active'
  createdAt: DateTime, default=now
